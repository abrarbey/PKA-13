add('Pusat evidence','Lampiran · pusat evidence','',head('Lampiran interaktif','Semua bukti, dalam satu tempat.','Cari kegiatan atau dokumen; buka langsung tanpa meninggalkan paparan.')+`<input class="archive-search" id="archiveSearch" placeholder="Cari: diagnosis, undangan, notulen, SK, dukungan, penilaian…" aria-label="Cari bukti"><div class="archive-grid" id="archiveGrid"></div><p class="caption archive-screen-note" style="margin-top:16px">PDF unggahan tersimpan dalam HTML tanpa kompresi ulang. Buka bukti, lalu scroll untuk membaca seluruh halamannya; PDF asli juga dapat diunduh.</p><p class="caption archive-print-note" style="margin-top:16px">Dokumen bukti dan video tersedia pada paparan HTML interaktif.</p>`,'Sumber: 10 paket kegiatan, SK 1246, Suket Dukungan, LAP DOCX dan kompilasi bukti penilaian.','Seluruh bukti lokal dapat dibuka tanpa koneksi. Tautan dokumen sumber mengarah ke file asal. Surat dukungan Bidang Pendapatan Pajak I tersedia sebagai PDF asli. Template dukungan Bidang Pendapatan Pajak II masih berstatus draf. Bukti publikasi adalah edukasi perpajakan.');
add('Inti aksi perubahan','Penutup','dark',`<div class="closing"><div><div class="eyebrow">Inti aksi perubahan</div><h2>Data menjadi<br>rujukan.<br><span class="minttext">Kolaborasi menjadi<br>tindakan.</span></h2><p class="quote">Purwarupa dashboard, pembagian peran dan tindak lanjut bersama memperkuat upaya peningkatan kepatuhan PBB-P2 di Kecamatan Cilandak.</p><div class="actions" style="margin-top:28px">${btn('Lihat aplikasi ↗','data-jump="Aplikasi Dashboard Kolaborasi"','ghost')}</div></div><div class="close-list"><div><span>HASIL JANGKA PENDEK</span><b>4 indikator melampaui target.</b></div><div><span>PENGUATAN KEPEMIMPINAN</span><b>Nilai gabungan 8,35 → 8,67.</b></div><div><span>DASAR KEBERLANJUTAN</span><b>SK Kepala Bapenda<br>Nomor 1246 Tahun 2026.</b></div><p class="caption" style="margin-top:23px">Terima kasih.<br>Muhamad Abrar Saputrabey · PKA Angkatan XIII Tahun 2026</p></div></div>`,sourceLAP,'Tutup dengan tiga hasil: purwarupa dan tata kelola kolaborasi tersedia, indikator agregat membaik selama implementasi, dan keberlanjutan memiliki dasar formal. Siapkan pusat evidence untuk sesi tanya jawab.');
add('Terima Kasih','Terima kasih','dark thanks',`<div class="thanks-logos" aria-label="Logo Pemerintah Provinsi DKI Jakarta, BPSDM DKI Jakarta, Bapenda DKI Jakarta, dan LAN"><div class="thanks-logo dki">${img('image1.png','Logo Pemerintah Provinsi DKI Jakarta')}</div><div class="thanks-logo">${img('logo-bpsdm','Logo BPSDM Provinsi DKI Jakarta')}</div><div class="thanks-logo">${img('logo-bapenda','Logo Badan Pendapatan Daerah DKI Jakarta')}</div><div class="thanks-logo lan">${img('logo-lan','Logo Lembaga Administrasi Negara Republik Indonesia')}</div></div><div class="thanks-message"><div class="eyebrow">Pelatihan Kepemimpinan Administrator · Angkatan XIII</div><h2>Terima Kasih</h2><p class="closing-line">Atas perhatian, dukungan, dan kolaborasi.</p><div class="thanks-rule"></div><p class="thanks-name">Muhamad Abrar Saputrabey</p><p class="thanks-role">Kepala UPPPD Kecamatan Cilandak<br>Badan Pendapatan Daerah Provinsi DKI Jakarta</p></div><div class="actions thanks-actions">${btn('← Awal paparan','data-goto="0"','ghost')}${btn('Pusat evidence ↗','data-evidence-center','ghost')}</div>`,'PKA Angkatan XIII Tahun 2026 · BPSDM Provinsi DKI Jakarta','Sampaikan terima kasih kepada penguji, mentor, coach, Tim Efektif, serta seluruh pihak yang mendukung aksi perubahan. Logo DKI Jakarta menggunakan gambar vektor Jaya Raya; rujukan lambang pada situs Pemprov DKI dan berkas vektor Wikimedia Commons. Logo BPSDM, Bapenda, dan LAN berasal dari sumber resmi; seluruhnya tertanam dalam berkas HTML.');

leadership.body=head('09 · Kepemimpinan dan Pengembangan Kompetensi','Memimpin perubahan.<br>Mengembangkan tim dan menerapkan pembelajaran.')+`<div class="merged-development"><div class="card"><span class="label accent">01 · KEPEMIMPINAN TRANSFORMASIONAL</span><h3>Arah, keteladanan,<br>dan pendampingan.</h3><ul><li><b>Keteladanan:</b> verifikasi data dan batas kewenangan.</li><li><b>Motivasi bersama:</b> menyatukan tujuan lintas wilayah.</li><li><b>Pemecahan masalah:</b> uji coba dan perbaikan fitur.</li><li><b>Pendampingan:</b> bantuan sesuai kebutuhan anggota.</li></ul>${btn('Rincian & evidence kepemimpinan ↗','data-supplement="Kepemimpinan kinerja"')}</div><div class="card"><span class="label accent">02 · PENGEMBANGAN KOMPETENSI TIM</span><h3>Petakan kebutuhan.<br>Dampingi melalui praktik.</h3><ol><li>Petakan kemampuan dan kemauan Tim Efektif.</li><li>Berikan bimbingan teknis, komunikasi personal, dan penguatan motivasi sesuai kebutuhan.</li><li>Praktikkan pengolahan data, uji dashboard, pencatatan tindak lanjut, dan sosialisasi.</li></ol>${btn('Peta kompetensi & pendampingan ↗','data-supplement="Pengembangan kompetensi Tim Efektif"')}</div><div class="card"><span class="label accent">03 · PENERAPAN MATA PELATIHAN</span><h3>Pembelajaran menjadi<br>praktik kerja.</h3><ul><li><b>Akuntabilitas Kinerja:</b> KPI, validasi data, dan evidence.</li><li><b>Organisasi Digital:</b> purwarupa, impor data, serta penyempurnaan.</li><li><b>Manajemen Kinerja:</b> pembagian tugas, prioritas, monitoring, dan evaluasi.</li></ul>${btn('Buku rujukan & evidence penerapan ↗','data-supplement="Tiga mata pelatihan pilihan"')}</div></div><p class="merged-development-note">Klik setiap rincian untuk membuka bukti kegiatan, peta kompetensi sebelum–sesudah, dan rujukan tiga mata pelatihan.</p>`;

intro.body=head('01 · Titik berangkat, tujuan, manfaat dan milestone','Data menjadi dasar perubahan.')+`<div class="starting-layout"><div class="starting-left"><section class="starting-baseline"><div class="starting-kicker">Kondisi awal · s.d. Juli 2026</div><p class="starting-statement">Data kinerja perlu diterjemahkan menjadi prioritas dan tindakan bersama.</p><div class="starting-history-label">Kinerja PBB-P2 · 2023–2026</div><table class="starting-history"><thead><tr><th>Indikator</th><th>2023</th><th>2024</th><th>2025</th><th>2026*</th></tr></thead><tbody>${introHistory.map(r=>`<tr>${r.map((v,j)=>j===0?`<th>${e(v)}</th>`:`<td>${e(v)}</td>`).join('')}</tr>`).join('')}</tbody></table><p class="starting-footnote">*Realisasi 2026 sampai dengan Juli 2026.</p></section><div class="intro-label starting-benefit-label">Manfaat aksi perubahan</div><div class="intro-benefits">${[['↗','Penerimaan pajak daerah di Kecamatan Cilandak meningkat.'],['↓','Piutang pajak daerah di Kecamatan Cilandak menurun.'],['◆','Dukungan APBD untuk pembangunan dan pelayanan publik menguat.']].map(([icon,text])=>`<div><span>${icon}</span><b>${text}</b></div>`).join('')}</div></div><div class="starting-right"><div class="intro-label">Alur perubahan <button class="starting-detail-link" data-intro-flow>Klik untuk rincian lengkap ↗</button></div><div class="starting-flow">${introFullFlow.map((x,i)=>`<section class="starting-flow-step step-${i}"><span class="starting-number">${i+1}</span><div><b>${e(x[0])}</b><p>${i===3?'<strong>'+e(introFlowSummary[i])+'</strong>':e(introFlowSummary[i])}</p></div></section>`).join('')}</div><div class="continuity-milestone-heading"><b>Milestone</b><span>Klik untuk tahapan kegiatan ↗</span></div><div class="continuity-milestones">${[['short','60 hari','Purwarupa yang digunakan bersama.','Kinerja PBB-P2, objek prioritas, dan koordinasi tindak lanjut.'],['medium','3–6 bulan','Memperluas pemantauan PBJT.','Informasi dan tindak lanjut lima kelompok PBJT sesuai karakteri function buildPdfPages(s){if(s.closed)return;const oldHeight=s.viewport.scrollHeight,oldScroll=s.viewport.scrollTop;if(s.observer)s.observer.disconnect();for(const en of s.entries)if(en.task)try{en.task.cancel()}catch{};s.generation++;s.queue=[];const baseWidth=Math.max(260,Math.min(1100,s.viewport.clientWidth-48));s.pageWidth=Math.round(baseWidth*s.zoom/100);s.stack.style.width=s.pageWidth+'px';const d=D.docs[s.id];s.stack.innerHTML=s.ps.map((pn,i)=>{const dim=d.dimensions[pn-1]||[595,842],origin=d.originalPageNumbers?d.originalPageNumbers[pn-1]:pn;return `<section class="pdf-sheet" data-pdf-index="${i}" data-rendered="false" aria-label="Halaman ${origin} PDF sumber"><div class="pdf-sheet-heading"><span>Halaman ${origin}${d.originalPageNumbers?' pada PDF sumber':''}</span><span>${i+1} dari ${s.ps.length}</span></div><div class="pdf-page-frame" style="aspect-ratio:${dim[0]}/${dim[1]}"><canvas class="pdf-page-canvas" role="img" aria-label="Isi halaman ${origin} PDF sumber"></canvas><div class="pdf-page-loading"><span class="pdf-spinner" aria-hidden="true"></span><span>Menyiapkan halaman PDF…</span></div></div></section>`}).join('');s.entries=[...s.stack.querySelectorAll('.pdf-sheet')].map((el,i)=>({el,index:i,pageNumber:s.ps[i],canvas:el.querySelector('canvas'),near:false,status:'idle',generation:s.generation,task:null}));s.observer=new IntersectionObserver(entries=>{if(s.closed)return;for(const change of entries){const en=s.entries[Number(change.target.dataset.pdfIndex)];if(!en)continue;en.near=change.isIntersecting;if(en.near){enqueuePdfPage(s,en);}else{if(en.task)try{en.task.cancel()}catch{};if(en.status==='ready'){en.canvas.width=0;en.canvas.height=0;en.status='idle';en.el.dataset.rendered='false';}}}},{root:s.viewport,rootMargin:'850px 0px',threshold:0});for(const en of s.entries)s.observer.observe(en.el);if(oldScroll>0&&oldHeight>0)s.viewport.scrollTop=oldScroll/oldHeight*s.viewport.scrollHeight;const label=document.getElementById('zoomLabel');if(label)label.te function openSupportEvidence(){modal('Bukti dukungan wilayah dan bidang','10 surat dukungan · Pilih bukti untuk membacanya',`<div class="support-evidence-body"><div class="support-evidence-grid">${D.supports.map(x=>`<button class="btn" data-doc="12" data-pages="${x[2]}" data-title="Surat dukungan · ${e(x[0])}">${e(x[0])} ↗</button>`).join('')}<button class="btn" data-doc="bpp1" data-title="Surat dukungan · Bidang Pendapatan Pajak I">Bidang Pendapatan Pajak I ↗</button><button class="btn" data-image="support-bpp2-original" data-caption="Surat dukungan Bidang Pendapatan Pajak II · Nomor 949/UD.02.01 · Jimmi R. Pardede">Bidang Pendapatan Pajak II ↗</button></div><p>Surat Bidang Pendapatan Pajak I: PDF asli. Surat Bidang Pendapatan Pajak II: foto dokumen bertanda tangan yang diunggah peserta.</p></div>`,'','support-evidence-modal');}

function scoreRefs(i){const s=D.scores[i];modal('Dasar rekap nilai '+s.title,'Angka mengikuti narasi LAP dan instrumen penilaian tertanam pada DOCX.',`<div class="panelbody bodytext"><p>Perbandingan sebelum dan sesudah mengikuti Bab V dan Bab VII LAP. Rata-rata akhir ${e(s.title.toLowerCase())}: <b>${fmt(s.before[3])} → ${fmt(s.after[3])}</b>.</p><p style="margin-top:16px">Nilai gabungan menggunakan pembobotan <b>30% peserta + 70% mentor</b>, sesuai formula pada instrumen tertanam; perhitungan menggunakan nilai sebelum pembulatan.</p><p style="font-size:16px;color:#617580;margin-top:18px">Pindai rekap peserta dalam kompilasi PDF memuat nilai awal yang sama dengan sesudah. Untuk perbandingan, paparan memakai nilai awal pada narasi dan instrumen awal DOCX; pindai asli tetap ditampilkan sebagai bukti sumber.</p><div class="actions" style="margin-top:23px"><a class="btn" href="https://chatgpt.com/library?file_id=libfile_af4e3d08c6588191992598237b085909&account_id=personal" target="_blank" rel="noopener">Buka LAP DOCX ↗</a><button class="btn" data-doc="assessment" data-title="Bukti formulir penilaian">Lihat bukti pindai ↗</button></div></div>`);}
function supportTemplate(key){const field=key==='bpp1'?'I':'II';const technical=field==='I'?'Memberikan konsultasi teknis PBB-P2, mendukung verifikasi data, dan memberikan masukan atas penetapan objek prioritas serta evaluasi tindak lanjut sesuai kewenangan.':'Mendukung koordinasi teknis pengembangan pemantauan PBJT, penyiapan kebutuhan informasi, serta evaluasi penerapan sesuai kewenangan dan kesiapan unit terkait.';const body=`<article class="support-letter"><div class="draft-banner">DRAF TEMPLATE · BELUM DITERBITKAN / DITANDATANGANI</div><header>${img('image1.png','Lambang Pemerintah Provinsi DKI Jakarta')}<div><b>PEMERINTAH PROVINSI DAERAH KHUSUS IBUKOTA JAKARTA</b><b>BADAN PENDAPATAN DAERAH</b><span>BIDANG PENDAPATAN PAJAK ${field}</span></div></header><h2>SURAT PERNYATAAN DUKUNGAN</h2><p class="letter-number">Nomor: [diisi setelah penerbitan]</p><p>Yang bertanda tangan di bawah ini:</p><dl><dt>Nama</dt><dd>[Nama lengkap pejabat]</dd><dt>NIP</dt><dd>[NIP pejabat]</dd><dt>Jabatan</dt><dd>Kepala Bidang Pendapatan Pajak ${field}</dd><dt>Unit kerja</dt><dd>Badan Pendapatan Daerah Provinsi DKI Jakarta</dd></dl><p>Dengan ini menyatakan dukungan terhadap aksi perubahan <b>“Peningkatan Kepatuhan Wajib Pajak dalam Pembayaran PBB-P2 melalui Strategi Kolaborasi dengan Pihak Terkait di Kecamatan Cilandak”</b> yang dilaksanakan oleh <b>Muhamad Abrar Saputrabey</b>, Kepala UPPPD Kecamatan Cilandak.</p><p>Bentuk dukungan yang direncanakan:</p><ol><li>${technical}</li><li>Berkoordinasi dengan UPPPD Kecamatan Cilandak dan unsur terkait dalam pemanfaatan Dashboard Kolaborasi serta pembahasan hasil monitoring dan evaluasi.</li><li>Mendukung keberlanjutan pengembangan sesuai Keputusan Kepala Bapenda Nomor 1246 Tahun 2026, dengan memperhatikan kewenangan, rencana kerja, kesiapan sumber daya, serta ketentuan pengelolaan data perpajakan.</li></ol><p>Surat pernyataan ini dibuat untuk dipergunakan sebagaimana mestinya setelah melalui verifikasi dan persetujuan pejabat yang berwenang.</p><div class="letter-signature">Jakarta, [tanggal bulan tahun]<br>Kepala Bidang Pendapatan Pajak ${field}<br><br><br><br>[Tanda tangan dan stempel]<br><b>[Nama lengkap pejabat]</b><br>NIP [..................]</div><p class="letter-disclaimer">Template ini disiapkan untuk melengkapi berkas. Isi, nomenklatur, nomor, identitas, dan bentuk dukungan perlu diverifikasi sebelum penerbitan.</p></article>`;const standalone=`<!doctype html><html lang="id"><meta charset="utf-8"><title>Draf Surat Dukungan BPP ${field}</title><style>${document.getElementById('revision-style').textContent}body{background:#e9efec;margin:0;font-family:Arial,sans-serif;color:#173b43}.support-letter{max-width:850px;margin:30px auto;background:white;padding:50px;font-size:16px}@media print{body{background:white}.support-letter{padding:0;margin:0}.draft-banner{border:1px solid #be8b2f}}</style>${body}</html>`;const url=URL.createObjectURL(new Blob([standalone],{type:'text/html;charset=utf-8'}));modal('Template dukungan · Bidang Pendapatan Pajak '+field,'Draf siap ditinjau · Surat asli belum tersedia',`<div class="letter-viewport">${body}</div>`,`<div class="doccontrols"><span>DRAF · Belum ditandatangani</span><a class="btn" href="${url}" download="Draf_Surat_Dukungan_Bidang_Pendapatan_Pajak_${field}.html">Unduh template HTML ↓</a></div>`,'letter-modal');}

function activitySlideIndex(i){return activitySlides[i]?i:-1;}
function openActivityPopup(i){const slideIndex=activitySlideIndex(i);if(slideIndex<0)return;activityModalContext=i;activityPresentationMode=false;const a=D.activities[i],s=activitySlides[slideIndex];modal('Kegiatan '+String(i+1).padStart(2,'0')+' · '+shortTitles[i],a.date+' · '+a.phase,`<div class="activity-popup-content activity">${s.body}<p class="activity-popup-source">${e(s.source)}</p></div>`,`<div class="activity-popup-controls"><span>Evidence tetap dapat dibuka dari pop-up ini.</span>${btn('Buka sebagai slide →',`data-activity-slide="${i}"`)}</div>`,'activity-modal');}
function openActivitySlide(i){i=Number(i);const x=activitySlides[i];if(!x)return;activityModalContext=i;activityPresentationMode=true;modal('Kegiatan '+String(i+1).padStart(2,'0')+' / 10 · '+shortTitles[i],'Mode slide kegiatan · Tutup untuk kembali ke Pelaksanaan 60 hari',`<div class="activity-popup-content activity">${x.body}<p class="activity-popup-source">${e(x.source)}</p></div>`,`<div class="activity-sequence-controls"><button class="btn" data-activity-slide="${i-1}" ${i===0?'disabled':''}>← Sebelumnya</button><span>${String(i+1).padStart(2,'0')} / 10</span><button class="btn" data-activity-slide="${i+1}" ${i===9?'disabled':''}>Berikutnya →</button><button class="btn" data-close>Kembali ke tahapan</button></div>`,'activity-modal activity-sequence-modal');}
function returnActivity(){if(activityPresentationMode)openActivitySlide(activityModalContext);else openActivityPopup(activityModalContext);}

function openDiagnosisDetail(i){const x=diagnosisNarratives[i];if(!x)return;modal(x.title,'Alur diagnosis dan gagasan perubahan PBB-P2',`<div class="narrative-popup"><div class="narrative-label">${i+1} / 5 · ${e(x.title)}</div>${x.paragraph?`<p>${e(x.paragraph)}</p>`:''}${x.items.length?`<ul>${x.items.map((t,j)=>`<li>${i===3&&j===0?'<b>'+e(t)+'</b>':e(t)}</li>`).join('')}</ul>`:''}<div class="narrative-nav">${i>0?btn('← '+diagnosisNarratives[i-1].title,`data-diagnosis-detail="${i-1}"`):''}${i<4?btn(diagnosisNarratives[i+1].title+' →',`data-diagnosis-detail="${i+1}"`):''}</div></div>`,'','narrative-modal');}
function openMilestone(key){const x=milestonePhases[key];if(!x)return;let group='';const rows=x.rows.map((r,i)=>{let g='';if(group!==r.phase){group=r.phase;g=`<tr class="milestone-group"><th colspan="5">${e(group)}</th></tr>`;}return g+`<tr><td>${String(i+1).padStart(2,'0')}</td><td><b>${e(r.activity)}</b></td><td>${e(r.pic)}</td><td>${e(r.time)}</td><td>${e(r.output)}</td></tr>`;}).join('');modal('Tahapan kegiatan · '+x.title,x.period+' · '+x.status,`<div class="milestone-scroll"><table class="milestone-table"><colgroup><col style="width:5%"><col style="width:32%"><col style="width:21%"><col style="width:15%"><col style="width:27%"></colgroup><thead><tr><th>No.</th><th>Kegiatan</th><th>Pelaksana / PIC</th><th>Waktu</th><th>Output</th></tr></thead><tbody>${rows}</tbody></table><p class="milestone-source">${e(x.source)}</p></div>`,`<div class="milestone-controls"><span>10 tahapan · Scroll untuk membaca seluruh rincian</span>${key==='short'?btn('Lihat 10 kegiatan & evidence →','data-jump="Sepuluh tahapan kegiatan" data-dismiss'):btn('Baca SK lengkap ↗','data-doc="2" data-title="SK 1246 Tahun 2026 · Seluruh halaman"')}</div>`,'milestone-modal');}

function help(){modal('Menggunakan paparan','Paparan web dengan foto, PDF, video, dan tautan Dashboard Kolaborasi.',`<div class="panelbody"><div class="helpgrid">${[['Slide sebelumnya / berikutnya','← / →'],['Daftar seluruh slide','G'],['Catatan penyaji','N'],['Layar penuh','F'],['Cetak semua slide','P'],['Tutup bukti / daftar slide','Esc'],['Ke slide pertama / terakhir','Home / End'],['Waktu penyajian','Klik ◷']].map(h=>`<div><span>${h[0]}</span><kbd>${h[1]}</kbd></div>`).join('')}</div><p class="bodytext" style="font-size:16px;margin-top:25px">Pada slide kegiatan, tombol Undangan, Daftar hadir, Notulen, Foto kegiatan dan Output membuka halaman terkait. Scroll di area dokumen untuk membaca semua halaman secara berurutan. Perbesar PDF dengan + dan −; ketajaman mengikuti PDF asli. Pada ponsel, gulir ke bawah untuk membaca slide dan gunakan tombol panah untuk berpindah.</p><p style="font-size:14px;color:#617580;margin-top:18px">Versi GitHub memuat foto, PDF, dan video dari folder pendamping. Akses melalui website; PDF dan video dimuat saat dibuka. Untuk presentasi tanpa internet, gunakan HTML versi offline. Untuk menyimpan PDF, gunakan tombol Cetak semua slide atau Ctrl+P, pilih Simpan sebagai PDF dan skala 100%. Ukuran A4 landscape dan margin nol telah ditetapkan otomatis. Pilih A4, orientasi landscape, skala 100%, dan margin tidak ada pada dialog cetak. Aktifkan grafik latar belakang serta matikan header/footer browser bila opsi tersebut tersedia.</p></div>`);}
let toastTimer;function toast(t){$('#toast').textContent=t;$('#toast').classList.add('open');clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('#toast').classList.remove('open'),3600);}
async function full(){try{if(!document.fullscreenElement)await document.documentElement.requestFullscreen();else await document.exitFullscreen()}catch{toast('Gunakan F11 pada browser untuk membuka layar penuh.')}}
document.addEventListener('click',ev=>{const b=ev.target.closest('button,a');if(!b)return;const ds=b.dataset;if('close'in ds){closeModal();return;}if('goto'in ds){go(ds.goto);if('dismiss'in ds)closeModal();return;}if('activityPopup'in ds){openActivityPopup(Number(ds.activityPopup));return;}if('activitySlide'in ds){openActivitySlide(Number(ds.activitySlide));return;}if('backActivity'in ds&&activityModalContext!==null){returnActivity();return;}if('diagnosisDetail'in ds){openDiagnosisDetail(Number(ds.diagnosisDetail));return;}if(ds.milestone){openMilestone(ds.milestone);return;}if(ds.jump){const target=slides.findIndex(s=>s.title===ds.jump||s.chapter===ds.jump);if(target>=0)go(target);if('dismiss'in ds)closeModal();return;}if(ds.supportTemplate){supportTemplate(ds.supportTemplate);return;}if(ds.image){openImages(ds.image,ds.caption);return;}if(ds.images){openImages(ds.images,ds.title);return;}if(ds.testimoni){openTestimoni(ds.testimoni);return;}if('tutorial'in ds){openTutorial();return;}if(ds.doc){openDoc(ds.doc,ds.pages,ds.title);return;}if(ds.zoom&&modalState){zoomPdf(ds.zoom);return;}if('zoomReset'in ds){zoomPdf(0,true);return;}if(ds.pdfdownload){downloadPdf(ds.pdfdownload);return;}if(ds.pdfnative){openPdfNative(ds.pdfnative);return;}if('allpages'in ds&&modalState){openDoc(modalState.id,null,'Dokumen kegiatan lengkap');return;}if(ds.appview){$('#appPreview').src=A[ds.appview];$('#appScreenZoom').dataset.image=ds.appview;$$('[data-appview]').forEach(x=>x.classList.toggle('on',x===b));return;}if(ds.stakeholders){stakeholders();return;}if('scorerefs'in ds){scoreRefs(Number(ds.scorerefs));return;}});
let printPreparing=false;
async function printDeck(){
 if(printPreparing)return;printPreparing=true;
 const control=$('#printBtn');control.disabled=true;
 try{
  if(overlay.classList.contains('open'))closeModal();
  await document.fonts.ready;
  await Promise.all([...stage.querySelectorAll('img')].map(im=>im.decode().catch(()=>{})));
  await new Promise(resolve=>requestAnimationFrame(()=>requestAnimationFrame(resolve)));
  window.print();
 }finally{printPreparing=false;control.disabled=false;}
}
$('#prev').onclick=()=>go(index-1);$('#next').onclick=()=>go(index+1);$('#outlineBtn').onclick=outline;$('#notesBtn').onclick=()=>$('#notes').classList.toggle('open');$('#helpBtn').onclick=help;$('#fullBtn').onclick=full;$('#printBtn').onclick=printDeck;overlay.addEventListener('click',ev=>{if(ev.target===overlay)closeModal()});$('#archiveSearch')?.addEventListener('input',ev=>archive(ev.target.value));
document.addEventListener('keydown',ev=>{const typing=/INPUT|TEXTAREA|SELECT/.test(ev.target.tagName);if(overlay.classList.contains('open')){if(!typing&&activityPresentationMode&&panel.classList.contains('activity-sequence-modal')&&['ArrowLeft','ArrowRight'].includes(ev.key)){ev.preventDefault();openActivitySlide(activityModalContext+(ev.key==='ArrowRight'?1:-1));return;}if(ev.key==='Escape'){ev.preventDefault();closeModal();return;}if(ev.key==='Tab'){const focusable=[...overlay.querySelectorAll('button:not(:disabled),a,select,input')].filter(x=>x.offsetParent!==null),first=focusable[0],last=focusable[focusable.length-1];if(ev.shiftKey&&document.activeElement===first){ev.preventDefault();last.focus()}else if(!ev.shiftKey&&document.activeElement===last){ev.preventDefault();first.focus()}return;}if(!typing&&modalState&&modalState.kind==='pdf'&&['PageDown','PageUp','ArrowDown','ArrowUp','Home','End',' '].includes(ev.key)){ev.preventDefault();const v=modalState.viewport;if(ev.key==='Home')v.scrollTo(0,0);else if(ev.key==='End')v.scrollTo(0,v.scrollHeight);else v.scrollBy(0,(['PageUp','ArrowUp'].includes(ev.key)?-1:1)*(ev.key.startsWith('Arrow')?90:v.clientHeight*.85));}return;}if(typing||ev.ctrlKey||ev.altKey||ev.metaKey)return;if(['ArrowRight','PageDown'].includes(ev.key)||(ev.key===' '&&!['BUTTON','A'].includes(ev.target.tagName))){ev.preventDefault();go(index+1)}else if(['ArrowLeft','PageUp'].includes(ev.key)){ev.preventDefault();go(index-1)}else if(ev.key==='Home'){ev.preventDefault();go(0)}else if(ev.key==='End'){ev.preventDefault();go(slides.length-1)}else if(ev.key.toLowerCase()==='g'){ev.preventDefault();outline()}else if(ev.key.toLowerCase()==='n')$('#notes').classList.toggle('open');else if(ev.key.toLowerCase()==='f'){ev.preventDefault();full()}else if(ev.key.toLowerCase()==='p'){ev.preventDefault();printDeck()}else if(ev.key==='Escape')$('#notes').classList.remove('open');else if(ev.key==='?')help();});
let started=null,elapsed=0;$('#timer').onclick=()=>{if(started){elapsed+=Date.now()-started;started=null}else started=Date.now();updateTimer()};function updateTimer(){if(!started&&!elapsed)return;const n=Math.floor((elapsed+(started?Date.now()-started:0))/1000);$('#timer').textContent=(started?'◷ ':'Ⅱ ')+String(Math.floor(n/60)).padStart(2,'0')+':'+String(n%60).padStart(2,'0');}setInterval(updateTimer,1000);
window.addEventListener('resize',resize);document.addEventListener('fullscreenchange',resize);renderStakeholderMap('before','#stakeMatrixBefore');renderStakeholderMap('after','#stakeMatrixAfter');archive();const initial=Number((location.hash.match(/slide-(\d+)/)||[])[1])-1;go(Number.isFinite(initial)?initial:0);
